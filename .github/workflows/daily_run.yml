name: Daily ETF Analysis

on:
  # 每日台灣時間 06:00 執行（UTC 22:00，前一天）
  schedule:
    - cron: '0 22 * * *'

  # 允許手動從 GitHub Actions 頁面觸發（方便測試）
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 最長執行 15 分鐘，避免卡住

    steps:
      # 1. 取得程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python 環境
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'  # 快取套件，加速後續執行

      # 3. 安裝套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 執行主程式
      - name: Run ETF analysis
        run: python main.py
        env:
          GEMINI_API_KEY_1:           ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2:           ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3:           ${{ secrets.GEMINI_API_KEY_3 }}
          SMTP_HOST:                  ${{ secrets.SMTP_HOST }}
          SMTP_PORT:                  ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME:              ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:              ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM:                  ${{ secrets.SMTP_FROM }}
          SMTP_TO:                    ${{ secrets.SMTP_TO }}
          SMTP_USE_SSL:               ${{ vars.SMTP_USE_SSL || 'false' }}
          SMTP_USE_TLS:               ${{ vars.SMTP_USE_TLS || 'true' }}

      # 5. 執行失敗時輸出詳細錯誤（方便除錯）
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-log-${{ github.run_id }}
          path: |
            *.log
          retention-days: 7
